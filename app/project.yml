# xcodegen spec. The .xcodeproj is generated, not committed (see .gitignore).
# Build:  cd app && xcodegen generate && xcodebuild -scheme ScreenpipeMenubar -configuration Debug build
# or:     app/build.sh
name: ScreenpipeMenubar
options:
  bundleIdPrefix: app.screenpipe
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  ScreenpipeMenubar:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.screenpipe.menubar
        GENERATE_INFOPLIST_FILE: YES
        # Menu-bar-only agent: no Dock icon, no main window.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT-licensed"
        # Dev/ad-hoc signing; Developer ID + notarization is sub-goal 06.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  ScreenpipeMenubar:
    build:
      targets:
        ScreenpipeMenubar: all
    run:
      config: Debug
